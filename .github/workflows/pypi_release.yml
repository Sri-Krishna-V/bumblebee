name: PyPI release

on:
  push:
    tags:
      # Publish on tags like v1.2.3.
      - "v*"

permissions: {}

jobs:
  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      # Create this environment in GitHub under Settings -> Environments, and
      # configure the matching PyPI trusted publisher for this workflow file.
      name: pypi
    permissions:
      contents: read
      id-token: write
    env:
      UV_PYTHON: "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
        with:
          enable-cache: false

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Set package version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then
            echo "Expected a tag starting with 'v', got '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          uv version "$version" --frozen
          echo "EXPECTED_PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py

      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*.tar.gz dist/*.whl
